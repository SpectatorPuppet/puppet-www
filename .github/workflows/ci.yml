name: CI
on:
  # Pull requests into dev (daily work) or main (release) are tested; so is main after a merge.
  # A merge into dev isn't tested again: its pull request already was.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions: { contents: read }
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
